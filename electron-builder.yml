appId: app.stickieview
productName: Stickieview
publish:
  provider: github
  owner: cyber-sami
  repo: stickieview
directories:
  output: dist-electron
files:
  - dist/**
  - electron/**
  - node_modules/**
linux:
  target:
    - AppImage
    - deb
  artifactName: stickieview-linux.${ext}
  category: Utility
  icon: assets/icons/
  executableArgs:
    - --no-sandbox
win:
  target: nsis
  artifactName: stickieview-windows.${ext}
  icon: assets/icon.ico
mac:
  target: dmg
  artifactName: stickieview-mac.${ext}
  icon: assets/icon.icns
